<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Timer Overlay</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pusher JS -->
    <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
    <style id="dynamic-styles"></style>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* OBS için şeffaf arkaplan */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #timer-container {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.5s ease, transform 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #timer-container.visible {
            opacity: 1;
            transform: scale(1);
        }

        .border-stroke {
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .no-border-stroke {
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Süre eklendiğinde parlama animasyonu */
        @keyframes pulse-green {
            0% { text-shadow: 0 0 10px #53ff53, 0 4px 10px rgba(0,0,0,0.5); transform: scale(1); }
            50% { text-shadow: 0 0 30px #53ff53, 0 4px 10px rgba(0,0,0,0.5); transform: scale(1.05); }
            100% { text-shadow: 0 0 10px #53ff53, 0 4px 10px rgba(0,0,0,0.5); transform: scale(1); }
        }
        .animate-add {
            animation: pulse-green 0.5s ease-out;
        }
    </style>
</head>
<body>

    <div id="timer-container">
        <div id="top-text" class="text-2xl font-bold opacity-90 mb-2"></div>
        <div id="time-display" class="text-7xl font-bold tracking-wider">00:00:00</div>
    </div>

        let remainingSeconds = 0;
        let timerInterval = null;

        function playSound(type) {
            try {
                if (type === 'beep') {
                    new Audio(beepBase64).play();
                } else if (type === 'quietBeep') {
                    new Audio(quietBeepBase64).play();
                } else if (type === 'end') {
                    // Bitiş melodisi için 3 kere hızlı bip
                    let beeps = 0;
                    let i = setInterval(() => {
                        new Audio(beepBase64).play();
                        beeps++;
                        if(beeps >= 3) clearInterval(i);
                    }, 150);
                }
            } catch(e) {
                console.log("Ses oynatılamadı", e);
            }
        }

        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            const pad = (num) => num.toString().padStart(2, '0');
            
            // Kullanıcı isteği: 60 dakikadan azsa 00:MM:SS, fazlaysa HH:MM:SS
            // İkisi de aynı pad mantığıyla çalışıyor.
            return `${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        function updateDisplay() {
            document.getElementById('time-display').textContent = formatTime(remainingSeconds);
        }

        function triggerAddDuration() {
            const addSeconds = durationMinutes * 60;
            
            if (remainingSeconds <= 0) {
                // Zamanlayıcı görünür yap, süreyi başlat
                remainingSeconds = addSeconds;
                container.classList.add('visible');
                updateDisplay();
                playSound('beep');
                startTimer();
            } else {
                // Halihazırda çalışıyor, süre ekle
                remainingSeconds += addSeconds;
                updateDisplay();
                playSound('quietBeep');
                
                // Parlama animasyonu ekle
                container.classList.remove('animate-add');
                void container.offsetWidth; // trigger reflow
                container.classList.add('animate-add');
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds <= 0) {
                    remainingSeconds = 0;
                    updateDisplay();
                    clearInterval(timerInterval);
                    timerInterval = null;
                    
                    playSound('end');
                    
                    // 3 saniye sonra gizle
                    setTimeout(() => {
                        container.classList.remove('visible');
                    }, 3000);
                } else {
                    updateDisplay();
                }
            }, 1000);
        }

        // Pusher & Kick Event Dinleme
        // Sadece kanal puan odulu (channel_points_redemption) ile tetiklenir
        // Normal chat mesajlari tetiklemez
        if (chatroomId && chatroomId !== 'unknown') {
            const pusher = new Pusher('32cbd69e4b950bf97679', {
                cluster: 'us2',
                forceTLS: true
            });

            const kickChannel = pusher.subscribe('chatrooms.' + chatroomId + '.v2');
            console.log('Kick chatroom subscribe edildi: chatrooms.' + chatroomId + '.v2');

            // Sadece ChatMessageEvent dinle - reward redemption icin
            kickChannel.bind('App\\Events\\ChatMessageEvent', function(rawData) {
                if (!triggerWord) return;
                try {
                    let eventData = rawData;
                    if (typeof rawData === 'string') eventData = JSON.parse(rawData);
                    if (eventData && typeof eventData.data === 'string') eventData = JSON.parse(eventData.data);
                    if (!eventData) return;

                    const msgType = (eventData.type || '').toLowerCase();
                    const metaType = ((eventData.metadata || {}).original_message || {}).metadata || {};
                    const metaMsgType = (metaType.type || '').toLowerCase();
                    const content = (eventData.content || '').toLowerCase();

                    console.log('[Event] type:', msgType, 'metaType:', metaMsgType, 'content:', content);

                    // ODULE OZGU: mesaj tipi channel_points_redemption ise tetikle
                    const isReward = (msgType === 'channel_points_redemption') || (metaMsgType === 'channel_points_redemption');
                    if (isReward && content.includes(triggerWord)) {
                        console.log('[ODUL TETIKLENDI]', content);
                        triggerAddDuration();
                    }
                } catch(e) {
                    console.error('Event parse error', e);
                }
            });

            // Debug: Tum eventleri goster (konsol loguna yaz, tetiklemez)
            kickChannel.bind_global(function(eventName, data) {
                if (eventName.startsWith('pusher:')) return;
                console.log('[Kick Event]', eventName, data);
            });
        }
